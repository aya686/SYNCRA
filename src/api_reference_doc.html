
<h2 class="sr-only">API Reference — all endpoints grouped by controller with method, path, params, and description</h2>

<style>
:root {
  --pad: 1rem 1.25rem;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-sans); }

.toolbar {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  padding: 0 0 1rem;
  align-items: center;
}
.toolbar input {
  flex: 1;
  min-width: 180px;
}
.filter-btns {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.filter-btn {
  font-size: 12px;
  padding: 4px 10px;
  border-radius: 20px;
  border: 0.5px solid var(--color-border-secondary);
  background: var(--color-background-secondary);
  color: var(--color-text-secondary);
  cursor: pointer;
  transition: all 0.15s;
}
.filter-btn.active, .filter-btn:hover {
  background: var(--color-background-primary);
  color: var(--color-text-primary);
  border-color: var(--color-border-primary);
}

.section { margin-bottom: 1.5rem; }
.section-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  border-radius: var(--border-radius-md);
  margin-bottom: 6px;
  cursor: pointer;
  user-select: none;
}
.section-header:hover { background: var(--color-background-secondary); }
.section-title {
  font-size: 14px;
  font-weight: 500;
  color: var(--color-text-primary);
}
.section-count {
  font-size: 11px;
  padding: 2px 7px;
  border-radius: 20px;
  margin-left: auto;
  font-weight: 500;
}
.chevron {
  font-size: 10px;
  color: var(--color-text-tertiary);
  transition: transform 0.2s;
}
.chevron.open { transform: rotate(90deg); }

.ep-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
  table-layout: fixed;
}
.ep-table th {
  font-size: 11px;
  font-weight: 500;
  color: var(--color-text-secondary);
  text-align: left;
  padding: 6px 10px;
  border-bottom: 0.5px solid var(--color-border-tertiary);
}
.ep-table td {
  padding: 7px 10px;
  border-bottom: 0.5px solid var(--color-border-tertiary);
  color: var(--color-text-primary);
  vertical-align: top;
  word-break: break-word;
}
.ep-table tr:last-child td { border-bottom: none; }
.ep-table tr:hover td { background: var(--color-background-secondary); }

.method-badge {
  font-size: 10px;
  font-weight: 500;
  padding: 2px 6px;
  border-radius: 4px;
  display: inline-block;
  white-space: nowrap;
}
.GET    { background: #EAF3DE; color: #3B6D11; }
.POST   { background: #E6F1FB; color: #185FA5; }
.PUT    { background: #FAEEDA; color: #854F0B; }
.DELETE { background: #FCEBEB; color: #A32D2D; }

.path-cell {
  font-family: var(--font-mono);
  font-size: 11.5px;
  color: var(--color-text-primary);
}
.params-cell { font-size: 12px; color: var(--color-text-secondary); }
.desc-cell { font-size: 12.5px; }

.hidden { display: none; }
.no-results {
  text-align: center;
  padding: 2rem;
  font-size: 14px;
  color: var(--color-text-secondary);
}

@media (max-width: 500px) {
  .col-params { display: none; }
}
</style>

<div class="toolbar">
  <input type="text" id="search" placeholder="Rechercher endpoint, méthode, chemin..." oninput="filter()" />
  <div class="filter-btns" id="method-filters"></div>
</div>

<div id="sections"></div>
<div class="no-results hidden" id="no-results">Aucun résultat.</div>

const COLORS = {
  Abonnement: "#7F77DD", Admin: "#1D9E75", Auth: "#D85A30",
  Avis: "#D4537E", Badge: "#378ADD", Client: "#BA7517",
  CodePromo: "#639922", Competence: "#985BA5", EmailVerification: "#185FA5",
  Etudiant: "#0F6E56", Freelancer: "#D85A30", Investisseur: "#BA7517",
  Plan: "#7F77DD", Portfolio: "#1D9E75", Role: "#D4537E",
  UserBadge: "#378ADD", User: "#639922", UserRole: "#A32D2D"
};

const CTRL_ORDER = [...new Set(RAW.map(r => r[0]))];
let activeMethod = "ALL";
let searchVal = "";

const methodFilters = document.getElementById("method-filters");
["ALL","GET","POST","PUT","DELETE"].forEach(m => {
  const btn = document.createElement("button");
  btn.className = "filter-btn" + (m === "ALL" ? " active" : "");
  btn.textContent = m;
  btn.onclick = () => {
    activeMethod = m;
    document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    render();
  };
  methodFilters.appendChild(btn);
});

function render() {
  const q = searchVal.toLowerCase();
  const container = document.getElementById("sections");
  container.innerHTML = "";
  let totalVisible = 0;

  CTRL_ORDER.forEach(ctrl => {
    let rows = RAW.filter(r => r[0] === ctrl);
    if (activeMethod !== "ALL") rows = rows.filter(r => r[1] === activeMethod);
    if (q) rows = rows.filter(r => r.join(" ").toLowerCase().includes(q));
    if (!rows.length) return;
    totalVisible += rows.length;

    const sec = document.createElement("div");
    sec.className = "section";

    const hdr = document.createElement("div");
    hdr.className = "section-header";
    hdr.innerHTML = `
      <span class="chevron open" id="chev-${ctrl}">▶</span>
      <span class="section-title">${ctrl}</span>
      <span class="section-count" style="background:${COLORS[ctrl]}22;color:${COLORS[ctrl]}">${rows.length} endpoint${rows.length>1?"s":""}</span>
    `;

    const body = document.createElement("div");
    body.id = "body-" + ctrl;

    const table = document.createElement("table");
    table.className = "ep-table";
    table.innerHTML = `<colgroup>
      <col style="width:60px">
      <col style="width:42%">
      <col class="col-params" style="width:25%">
      <col>
    </colgroup>
    <thead><tr>
      <th>Méthode</th>
      <th>Endpoint</th>
      <th class="col-params">Paramètres</th>
      <th>Description</th>
    </tr></thead>`;

    const tbody = document.createElement("tbody");
    rows.forEach(r => {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td><span class="method-badge ${r[1]}">${r[1]}</span></td>
        <td class="path-cell">${r[2]}</td>
        <td class="params-cell col-params">${r[3]}</td>
        <td class="desc-cell">${r[4]}</td>
      `;
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    body.appendChild(table);

    hdr.onclick = () => {
      const isOpen = body.style.display !== "none";
      body.style.display = isOpen ? "none" : "";
      document.getElementById("chev-" + ctrl).classList.toggle("open", !isOpen);
    };

    sec.appendChild(hdr);
    sec.appendChild(body);
    container.appendChild(sec);
  });

  document.getElementById("no-results").classList.toggle("hidden", totalVisible > 0);
}

function filter() {
  searchVal = document.getElementById("search").value;
  render();
}

render();
</script>
