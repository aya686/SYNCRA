<!-- src/app/components/notification-bell/notification-bell.component.html -->

<div class="notif-bell-wrapper">

  <!-- Bouton cloche coloré -->
  <button class="bell-btn" (click)="togglePanel()" [class.has-unread]="unreadCount > 0">
    <i class="bi bi-bell-fill bell-icon"></i>
    <span class="unread-badge" *ngIf="unreadCount > 0">
      {{ unreadCount > 99 ? '99+' : unreadCount }}
    </span>
    <span class="bell-pulse" *ngIf="unreadCount > 0"></span>
  </button>

  <!-- Panel dropdown -->
  <div class="notif-panel" [class.open]="showPanel">

    <!-- En-tête -->
    <div class="panel-header">
      <div class="panel-title">
        <i class="bi bi-bell-fill"></i>
        <span>Notifications</span>
        <span class="count-pill" *ngIf="unreadCount > 0">{{ unreadCount }} nouvelles</span>
      </div>
      <button class="mark-all-btn" (click)="markAllAsRead()" *ngIf="unreadCount > 0">
        Tout marquer lu
      </button>
    </div>

    <!-- Loader -->
    <div class="panel-loading" *ngIf="loading">
      <div class="spin-mini"></div>
      <span>Chargement...</span>
    </div>

    <!-- Liste -->
    <div class="notif-list" *ngIf="!loading">

      <!-- Vide -->
      <div class="notif-empty" *ngIf="notifications.length === 0">
        <i class="bi bi-bell-slash"></i>
        <p>Aucune notification</p>
      </div>

      <!-- Items -->
      <div class="notif-item"
           *ngFor="let notif of notifications"
           [class.unread]="!notif.isRead"
           (click)="navigateTo(notif)">

        <!-- Icône colorée -->
        <div class="notif-icon-wrap" [style.background]="getAccent(notif.type) + '20'">
          <i class="bi" [class]="getIcon(notif.type)"
             [style.color]="getAccent(notif.type)"></i>
        </div>

        <!-- Contenu -->
        <div class="notif-content">
          <div class="notif-title">{{ notif.title }}</div>
          <div class="notif-text">{{ notif.content }}</div>
          <div class="notif-time">{{ timeAgo(notif.createdAt) }}</div>
        </div>

        <!-- Actions -->
        <div class="notif-actions">
          <button class="action-read" *ngIf="!notif.isRead"
                  (click)="markAsRead(notif, $event)" title="Marquer comme lu">
            <i class="bi bi-check2"></i>
          </button>
          <button class="action-delete"
                  (click)="deleteNotif(notif, $event)" title="Supprimer">
            <i class="bi bi-x"></i>
          </button>
        </div>

        <!-- Dot non lu -->
        <div class="unread-dot" *ngIf="!notif.isRead"></div>
      </div>
    </div>

    <!-- Footer -->
    <div class="panel-footer" *ngIf="notifications.length > 0">
      <a routerLink="/notifications" (click)="showPanel = false">
        Voir toutes les notifications
        <i class="bi bi-arrow-right"></i>
      </a>
    </div>

  </div>
</div>
