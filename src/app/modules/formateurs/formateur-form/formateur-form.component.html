<div class="formateur-form-container">
  <div class="form-header">
    <h1>{{isEditMode ? 'Modifier' : 'Créer'}} un Formateur</h1>
    <p class="form-subtitle">Tous les champs marqués d'un * sont obligatoires</p>
  </div>

  <div *ngIf="loading" class="loading-spinner">
    <div class="spinner"></div>
    <p>Chargement...</p>
  </div>

  <form #formateurForm="ngForm" (ngSubmit)="onSubmit(formateurForm)" class="formateur-form">
    <div class="form-row">
  <div class="form-group">
    <label for="prenom">Prénom <span class="required">*</span></label>
    <input 
      type="text" 
      id="prenom" 
      name="prenom"
      [(ngModel)]="formateur.prenom" 
      #prenom="ngModel"
      required
      class="form-control"
      placeholder="Prénom du formateur">
  </div>

  <div class="form-group">
    <label for="nom">Nom <span class="required">*</span></label>
    <input 
      type="text" 
      id="nom" 
      name="nom"
      [(ngModel)]="formateur.nom" 
      #nom="ngModel"
      required
      class="form-control"
      placeholder="Nom du formateur">
  </div>
</div>
    
    <div class="form-group">
      <label for="expertise">
        Expertise / Spécialité <span class="required">*</span>
      </label>
      <input 
        type="text" 
        id="expertise" 
        name="expertise"
        [(ngModel)]="formateur.expertise" 
        #expertise="ngModel"
        required
        minlength="3"
        maxlength="100"
        placeholder="Ex: Développement Angular, Intelligence Artificielle..."
        class="form-control">
      <div class="error-message" *ngIf="submitted && expertise?.invalid">
        <span *ngIf="expertise?.errors?.['required']">L'expertise est obligatoire</span>
        <span *ngIf="expertise?.errors?.['minlength']">Minimum 3 caractères</span>
      </div>
    </div>

    <div class="form-group">
      <label for="bio">Biographie</label>
      <textarea 
        id="bio" 
        name="bio"
        [(ngModel)]="formateur.bio" 
        rows="5"
        maxlength="1000"
        placeholder="Décrivez l'expérience et les compétences du formateur..."
        class="form-control"></textarea>
      <div class="char-count" *ngIf="formateur.bio?.length">
        {{formateur.bio.length}} / 1000 caractères
      </div>
    </div>

    <div class="form-group">
      <label for="noteMoyenne">Note moyenne (0-5)</label>
      <input 
        type="number" 
        id="noteMoyenne" 
        name="noteMoyenne"
        [(ngModel)]="formateur.noteMoyenne" 
        min="0"
        max="5"
        step="0.1"
        class="form-control">
      <small class="helper-text">Note attribuée par les participants (optionnel)</small>
    </div>

    <div class="form-actions">
      <button type="button" class="btn-secondary" (click)="cancel()">Annuler</button>
      <button type="submit" class="btn-primary" [disabled]="loading">
        <span *ngIf="loading" class="spinner-small"></span>
        {{loading ? 'Enregistrement...' : 'Enregistrer'}}
      </button>
    </div>
  </form>
</div>
